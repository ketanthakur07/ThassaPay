version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: thassapay_db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: thassapay
      POSTGRES_USER: thassapay
      POSTGRES_PASSWORD: thassapay_local
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: thassapay_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
